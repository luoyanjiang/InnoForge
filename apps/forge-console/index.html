<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InnoForge · Intent OS</title>
  <link rel="stylesheet" href="/forge/styles.css">
  <link rel="stylesheet" href="/forge/workbench.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <button type="button" class="mobile-toggle" id="menu-btn" data-i18n="mobileMenu">菜单</button>
  <div class="overlay" id="overlay"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">◈</span>
          <p class="brand" data-i18n="brand">InnoForge</p>
        </div>
        <p class="tagline" data-i18n="tagline">创造流程操作系统</p>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="lang-row">
          <span data-i18n="language">语言</span>
          <button type="button" id="lang-zh" class="active">中文</button>
          <button type="button" id="lang-en">EN</button>
        </div>
        <div class="credit-pill quiet"><span data-i18n="credit">Credit</span><strong id="credit-bal">—</strong></div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="eyebrow"></p>
          <h1 class="page-title" id="page-title"></h1>
          <p class="page-sub" id="page-sub"></p>
        </div>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/forge/app.js"></script>
</body>
</html>
